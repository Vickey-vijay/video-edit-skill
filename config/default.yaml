# Default settings for every upload. Override per video with a sidecar file
# next to the video (same name, .yaml), with --config, or with --set key=value.

whisper:
  model: large-v3            # large-v3 (best for Tamil) | large-v3-turbo | medium | small
  # Nagarajan speaks Tamil with English trading terms. "auto" can pick English and
  # then Whisper translates instead of transcribing, so Tamil is the default.
  language: ta               # ta | en | auto
  device: cuda               # cuda | cpu (falls back to cpu automatically)
  compute_type: int8_float16 # cpu fallback uses int8
  beam_size: 5
  # Priming text: Tanglish in the style he speaks, with fillers and a repeat,
  # so Whisper keeps English terms in English and writes fillers instead of tidying them away.
  initial_prompt: "ம்ம், இது harmonic patterns class. அது வந்து, Fibonacci retracement, Gartley, Bat, Butterfly, Crab, Cypher patterns இருக்கு. okay பா, இந்த இந்த pattern பாருங்க, சரியா?"

cuts:
  max_pause: 0.45            # pauses longer than this (seconds) are cut down
  pause_threshold: 0.55      # silences longer than this are shortened ...
  keep_pause: 0.30           # ... to this, a natural breath
  pad_before: 0.08           # speech kept before the first word of a run
  pad_after: 0.14            # speech kept after the last word of a run
  min_cut: 0.12              # cuts shorter than this are skipped (avoids choppiness)
  min_segment: 0.25          # kept pieces shorter than this are dropped unless they hold a word
  keep_untranscribed_speech: 0.7   # loud stretches Whisper missed, longer than this, are kept
  trim_edges: true           # cut dead air before the first and after the last word
  fade_ms: 6                 # micro fade at every audio cut (prevents clicks)
  fillers: true              # hard fillers: um, uh, ம்ம் ...
  soft_fillers: isolated     # off | isolated (only when said alone between pauses) | all
  repeats: true              # "the the", "இந்த இந்த", "so we so we"
  stutters: true             # "pa- pattern", "அ அது"
  max_repeat_ngram: 3
  repeat_max_gap: 1.0
  # False starts: he begins a sentence, stops (even mid-word) and says it again.
  # The aborted attempt is cut. policy: normal (cut the sure ones, list the rest for review)
  # | aggressive (also cut the uncertain ones) | off
  restart:
    enabled: true
    policy: normal

zoom:
  enabled: true
  punch_in: 1.14             # zoom level on emphasis words
  ease_in: 0.35
  ease_out: 0.55
  hold_min: 1.4
  hold_max: 3.5
  min_interval: 6.0          # seconds between zoom events
  max_per_minute: 5
  zoom_out_reveal: true      # start zoomed in and pull out at the opening and after topic breaks
  reveal_from: 1.18
  reveal_duration: 0.9
  topic_break_gap: 2.0       # a cut pause longer than this counts as a topic break
  focus: auto                # auto (follows cursor/drawing activity) | center
  on_cuts: auto              # alternate punch level on jump cuts: auto (only for full-frame talking head) | true | false
  cut_punch: 1.07

captions:
  enabled: true
  max_words: 4
  max_chars: 24              # visible characters (Tamil vowel signs don't count)
  max_gap: 0.6               # start a new caption after a pause this long
  min_duration: 0.7          # shorter captions are folded into the previous one
  uppercase: false
  highlight_numbers: true
  highlight_emphasis: true   # words said noticeably louder than usual
  emphasis_db: 5.0
  pop: true                  # small scale pop when a caption appears
  write_srt: true            # also write an .srt for YouTube's subtitle upload

broll:
  enabled: true
  library: assets/broll/library.yaml
  duration: 3.6
  min_interval: 12.0
  max_per_minute: 2
  lead: 0.25                 # show the card slightly before the word

layout:
  mode: auto                 # auto | screen_face | full
  screen: null               # [x, y, w, h] in source pixels; null = auto-detect
  face: null                 # [x, y, w, h] in source pixels; null = auto-detect
  face_tile: 0               # which participant tile is the presenter (0 = top)
  # Trim inside the shared screen: auto (cut static browser tabs / ribbons / taskbar
  # at the top and bottom) or [top, bottom, left, right] as fractions of the screen.
  screen_trim: auto

audio:
  highpass: 70
  denoise: false
  loudness: -14              # LUFS target used by YouTube and Instagram
  true_peak: -1.5

outputs:
  youtube:
    enabled: true
    width: 1920
    height: 1080
    fps: 30
    cq: 21
    maxrate: 14M
  instagram:
    enabled: true
    width: 1080
    height: 1920
    fps: 30
    cq: 22
    maxrate: 10M
    max_seconds: 180         # longer edits are split into parts at sentence ends

encoder: auto                # auto (NVENC if available) | nvenc | x264

title: null                  # topic shown in the title chip; null = from filename

understand:                  # `understand`: Gemini watches and listens, judges every phrase
  model: gemini-pro-latest   # the strongest Gemini the key can use; any name from `understand --list-models`
  fallback_model: gemini-3.6-flash   # used when the key has no quota for the model above (a free key has none for Pro)
  refine_model: gemini-flash-latest
  target_seconds: "60-80"    # kept length to aim for (a range; the argument comes first)

short:                       # vertical Reel / Short pipeline
  # The look ("After Hours"): one calm warm-graphite room with an amber light low right; the themes market / gold / studio
  # (graphics.yaml `theme` / `themes`) only swap one mid-layer: glass with a price path / a banknote rosette / nothing.
  palette: graphite          # graphite (warm neutral slate, amber light, brass) | ink (blue-black)
  grain: 3.6                 # film grain over everything (levels of 255, rms)
  vignette: 0.30
  caption_scrim: 0.42        # darkening of the bottom 40% so captions and the hoodie logo do not fight
  finish:                    # last look over the composite
    saturation: 0.94         # a touch less colour so the yellow hoodie does not shout
    halation: 0.05           # faint warm bloom around the brightest areas
  # Setting him into the scene (vedit/edge.py, vedit/shorts.py Subject.layer). All work per frame, no state.
  edge:
    lo: 0.32                 # matte below this is gone, above `hi` is solid: a decisive edge, the ghost of a moving head is cut
    hi: 0.88
    feather: 1.0             # px of anti-aliasing on the edge
    hair_dark: 0.15          # darken the hair edge so it melts into the dark room instead of showing a grey rim
    wrap: 0.16               # light wrap of the room's own light onto his edge (body)
    wrap_hair: 0.07          # ... and onto the hair
    rim: 0.10                # rim light from the key light (top left) on edges that face it
    rim_hair: 0.045
    shadow: 0.30             # soft shadow on the room behind him
    glow: 0.07               # warm glow behind the shoulders (never behind the head)
  skin:
    enabled: true            # pull skin-like pixels toward a healthy brown (the phone lights one cheek blue-grey)
    strength: 0.65
    lift: 6.0                # gentle shadow lift on skin
    tame_yellow: 0.12        # take a little chroma out of the mustard hoodie
  workers: 4                 # render in this many parallel pieces (needs CPU cores; NVENC allows several sessions)
  encode: {cq: 19, maxrate: 18M}   # reel quality (the generic Instagram preset is lighter)

  # Cut-out of the speaker. RVM runs on the original footage; the result is then re-snapped to the
  # enhanced picture and the old room's colour is removed from his edge.
  matte:
    ratio: 0.75              # RVM downsample ratio for ~480p input (0.5 = faster, 1.0 = sees more detail)
    guide_radius: 8          # guided-filter radius (enhanced pixels)
    guide_eps: 0.0003        # smaller = follows finer hair edges, larger = smoother
    lo: 0.10                 # alpha below this becomes fully transparent ...
    hi: 0.92                 # ... and above this fully opaque
    feather: 0.8             # final edge softness (pixels)
    fusion_radius: 90        # foreground colour estimation radius

  # GPU enhancement (needs torch + a CUDA GPU; falls back to a plain upscale without them)
  enhance:
    enabled: auto            # auto | off
    scale: 2.7               # size of the subject layer relative to the source (2.7 -> 1296x2290 from 480x848)
    denoise: 0.5             # 0 = strongest clean-up of compression blocks, 1 = none (WhatsApp clips: 0.4-0.6)
    texture: 0.22            # share of the plain upscale mixed back so skin does not look waxy
    temporal: 0.55           # smoothing of fine detail between frames (0 = off): stops shimmer
    qp: 10                   # quality of the intermediate enhanced video (lower = better, bigger)
    stabilize: true          # steady hand-held footage shots (talk shots are left alone)
    stab_sigma: 15           # frames of camera-path smoothing
    stab_limit: 0.03         # largest correction, as a share of the frame width
    stab_zoom: 1.07          # crop-in that hides the edges a correction reveals

  # Hand-held footage problems. Swings, blur and exposure jolts are cut when nothing is said over
  # them; when he talks over them the last good frame is held (slowly pushed in) and the plan flags it.
  footage:
    check: true
    whip_px: 14              # camera step (px per frame at 480 wide) that is a swing, not a pan
    blur_ratio: 0.55         # sharpness below this share of its recent median counts as blur
    blur_min_frames: 4
    luma_jump: 7
    pad_frames: 3
    merge_frames: 6
    speech_cut_max: 0.35     # seconds of speech a bad stretch may hold and still be cut outright
